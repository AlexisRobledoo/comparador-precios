# Configuración para publicar la app en Render (render.com)
services:
  - type: web
    name: comparador-precios-rosario
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
